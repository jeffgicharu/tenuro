type Mutation {
  amendLease(input: AmendLeaseInput!): MutationAmendLeaseResult!
  createTask(input: CreateTaskInput!): MutationCreateTaskResult!
  deleteView(input: DeleteViewInput!): MutationDeleteViewResult!
  discardLeaseDraft(input: DiscardLeaseDraftInput!): MutationDiscardLeaseDraftResult!

  """
  Discards every change the visitor made, returning their copy to the company’s shared data.
  """
  resetMySandbox: MutationResetMySandboxResult!
  saveLeaseDraft(input: SaveLeaseDraftInput!): MutationSaveLeaseDraftResult!
  saveView(input: SaveViewInput!): MutationSaveViewResult!
  submitLease(input: SubmitLeaseInput!): MutationSubmitLeaseResult!
  updateTask(input: UpdateTaskInput!): MutationUpdateTaskResult!
}

union MutationAmendLeaseResult = MutationAmendLeaseSuccess | NotFound | PermissionDenied | QuotaExceeded | StaleVersion | ValidationFailed

type MutationAmendLeaseSuccess {
  data: AmendLeasePayload!
}

union MutationCreateTaskResult = MutationCreateTaskSuccess | NotFound | PermissionDenied | QuotaExceeded | StaleVersion | ValidationFailed

type MutationCreateTaskSuccess {
  data: CreateTaskPayload!
}

union MutationDeleteViewResult = MutationDeleteViewSuccess | NotFound | PermissionDenied | QuotaExceeded | StaleVersion | ValidationFailed

type MutationDeleteViewSuccess {
  data: DeleteViewPayload!
}


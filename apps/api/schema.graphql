  data: SaveViewPayload!
}

union MutationSubmitLeaseResult = MutationSubmitLeaseSuccess | NotFound | PermissionDenied | QuotaExceeded | StaleVersion | ValidationFailed

type MutationSubmitLeaseSuccess {
  data: SubmitLeasePayload!
}


  viewer: Viewer!
}

"""
The signed-in person’s private workspace: their changes, kept apart from everyone else’s.
"""
type Sandbox {
  """
  When the nightly reset clears every private workspace (03:00 Nairobi time).
  """
  nextResetAt: DateTime!
  writesLimit: Int!
  writesUsed: Int!
}


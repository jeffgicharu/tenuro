}

union MutationSaveLeaseDraftResult = MutationSaveLeaseDraftSuccess | NotFound | PermissionDenied | QuotaExceeded | StaleVersion | ValidationFailed

type MutationSaveLeaseDraftSuccess {
  data: SaveLeaseDraftPayload!
}

union MutationSaveViewResult = MutationSaveViewSuccess | NotFound | PermissionDenied | QuotaExceeded | StaleVersion | ValidationFailed


  """
  Passing rent today in the company’s reporting currency, at indicative exchange rates.
  """
  annualRentReporting: Money!
  areaSqm: Decimal!
  asc842Class: Asc842Class

  """People in this company who can own tasks."""
  assignableUsers: [User!]!

  """True when this is the visitor’s private copy."""
  changedInSandbox: Boolean!
  city: String!
  commencementDate: Date!
  costCentre: String
  countryCode: CountryCode!
  createdAt: DateTime!
  currency: CurrencyCode!

  """Negative once the lease has expired."""
  daysToExpiry: Int!
  deposits: [Deposit!]!

  """Incremental borrowing rate, effective annual, as a fraction."""
  discountRate: Decimal!
  documents(after: String, before: String, first: Int, last: Int): LeaseDocumentsConnection!
  escalations: [Escalation!]!
  exemption: LeaseExemption!
  expiryDate: Date!

  """The lease as form data (JSON), the starting point for an amendment."""
  formData: String!
  id: ID!
  incentives: Money!
  initialDirectCosts: Money!
  keyDates(after: String, before: String, first: Int, includeClosed: Boolean, last: Int): LeaseKeyDatesConnection!
  landlordName: String!
  lesseeEntity: String!
  nextKeyDate: Date
  nextKeyKind: KeyDateKind
  notes: String
  options: [LeaseOption!]!
  ownershipTransfers: Boolean!
  parties: [LeaseParty!]!
  paymentFrequency: PaymentFrequency!
  paymentTiming: PaymentTiming!
  premises: String!
  prepayments: Money!
  property: Property!
  propertyName: String!
  propertyType: PropertyType!
  reference: String!

  """Rent per payment period at commencement."""
  rentPerPeriod: Money!
  rentSchedule(after: String, before: String, first: Int, last: Int): LeaseRentScheduleConnection!
  rentSteps: [RentStep!]!
  restorationCost: Money!
  serviceChargePerPeriod: Money!
  standard: AccountingStandard!
  status: LeaseStatus!
  tasks(after: String, before: String, first: Int, includeDone: Boolean, last: Int): LeaseTasksConnection!
  termMonths: Int!
  updatedAt: DateTime!
  updatedBy: User
  usefulLifeMonths: Int

  """Increments on every change; send it back with amendments."""
